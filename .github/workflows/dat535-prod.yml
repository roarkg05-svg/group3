name: DAT535 — Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: self-hosted
    environment: main
    env:
      DAT535_ENV: prod
      DAT535_DATA_DIR: /tmp/spark-lab-data
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run test suite
        run: |
          unset SPARK_HOME
          export PATH="$JAVA_HOME/bin:/home/ubuntu/spark-env/bin:$PATH"
          python -m pytest tests/ -v

      - name: Run Production Pipeline
        run: |
          unset SPARK_HOME
          export PATH="$JAVA_HOME/bin:/home/ubuntu/spark-env/bin:$PATH"
          echo "=== Running Production Medallion Pipeline ==="
          python run_pipeline.py --env prod

      - name: Upload Production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prod-outputs-${{ github.run_number }}
          path: /tmp/spark-lab-data/prod/
          retention-days: 30
          if-no-files-found: ignore

      - name: Write pipeline summary
        run: |
          echo "## Production Pipeline Run" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
