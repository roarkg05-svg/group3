name: DAT535 Dev Medallion CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  verify-dev-pipeline:
    name: Verify Medallion Pipeline (Dev)
    runs-on: self-hosted
    env:
      DAT535_ENV: dev
      DAT535_DATA_DIR: /tmp/spark-lab-data
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Spark & Python environment
        run: |
          unset SPARK_HOME
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:/home/ubuntu/spark-env/bin:$PATH"
          which python
          python --version
          java -version

      - name: Run Pytest Unit & Integration Suite
        run: |
          unset SPARK_HOME
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:/home/ubuntu/spark-env/bin:$PATH"
          python -m pytest tests/ -v

      - name: Execute Dev Medallion Pipeline
        run: |
          unset SPARK_HOME
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:/home/ubuntu/spark-env/bin:$PATH"
          echo "=== Running Dev Medallion Pipeline ==="
          python run_pipeline.py --env dev
