name: Pipeline

on:
  workflow_dispatch:
  #push:
  #  branches: [ main ]
  schedule:
    # Alternative intervals (uncomment one and comment out the active line below):
    #- cron: '0 * * * *'    # every hour
    #- cron: '0 */6 * * *'  # every 6 hours
    #- cron: '0 0 1 * *'    # monthly, 1st of month at 00:00 UTC
    - cron: '0 0 * * *'     # active: every day at midnight UTC

jobs:
  run-pipeline:
    name: Run PySpark Pipeline
    runs-on: self-hosted
    env:
      DAT535_ENV: prod
      DAT535_DATA_DIR: /tmp/spark-lab-data
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run Pipeline
      run: |
        unset SPARK_HOME
        export PATH="$JAVA_HOME/bin:/home/ubuntu/spark-env/bin:$PATH"

        echo "=== Starting Medallion Pipeline Execution ==="
        python run_pipeline.py --env prod

        echo ""
        echo "=== Medallion Pipeline Completed Successfully ==="
